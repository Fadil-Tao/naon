services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: naon
      MINIO_ROOT_PASSWORD: naonnaon
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  create-bucket:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 naon naonnaon; do sleep 1; done;
      mc mb --ignore-existing local/naon;
      "

volumes:
  minio-data:
